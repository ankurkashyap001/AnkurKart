<div class="form-container">
  <h2>➕ Add New Product to Inventory</h2>
  
  <!-- (ngSubmit) का मतलब है कि फॉर्म सबमिट होने पर हमारा मेथड चले -->
  <form (ngSubmit)="submitForm()">
    
    <div class="form-group">
      <label for="name">Product Name:</label>
      <!-- टू-वे बाइंडिंग 'banana in a box' सिंटैक्स -->
      <input type="text" id="name" name="name" [(ngModel)]="newItemName" required placeholder="Enter product name...">
    </div>

    <div class="form-group">
      <label for="quantity">Quantity (Units):</label>
      <input type="number" id="quantity" name="quantity" [(ngModel)]="newItemQuantity" min="1" required>
    </div>

    <div class="form-group">
      <label for="price">Price per Unit (₹):</label>
      <input type="number" id="price" name="price" [(ngModel)]="newItemPrice" min="0" required>
    </div>

    <button type="submit" class="save-btn">🚀 Save Product</button>
  </form>
</div>
