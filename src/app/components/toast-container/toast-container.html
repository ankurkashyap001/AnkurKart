<div class="toast-container">
    @for (toast of toastService.toasts(); track toast.id) {
      <div 
        class="toast-pill d-flex align-items-center justify-content-between px-3 py-2.5 rounded-pill shadow-sm"
        [ngClass]="'toast-' + toast.type"
      >
        <div class="d-flex align-items-center gap-2 me-3 min-w-0">
          @switch (toast.type) {
            @case ('success') {
              <i class="bi bi-check-circle-fill fs-6 text-success"></i>
            }
            @case ('error') {
              <i class="bi bi-exclamation-octagon-fill fs-6 text-danger"></i>
            }
            @case ('warning') {
              <i class="bi bi-exclamation-triangle-fill fs-6 text-warning"></i>
            }
            @default {
              <i class="bi bi-info-circle-fill fs-6 text-primary"></i>
            }
          }
          <span class="toast-message fw-bold fs-8 text-truncate">{{ toast.message }}</span>
        </div>
  
        <button 
          type="button" 
          class="btn-close-toast border-0 bg-transparent p-0 text-muted d-flex align-items-center justify-content-center"
          (click)="toastService.remove(toast.id)"
          aria-label="Close"
        >
          <i class="bi bi-x-lg fs-8"></i>
        </button>
      </div>
    }
  </div>
