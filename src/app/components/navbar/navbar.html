<nav class="navbar navbar-expand-lg bg-white py-2 border-bottom shadow-sm sticky-top">
  <div class="container-fluid px-lg-4">
    
    <!-- 1. Brand Logo + Tagline -->
    <a class="navbar-brand d-flex flex-column text-decoration-none me-4" routerLink="/">
      <span class="fw-bold text-brand-dark fs-3 lh-1">
        Ankur<span class="text-brand-orange">Kart</span>
      </span>
      <small class="text-muted fs-8 fw-semibold tracking-wide">Fresh. Fast. For You.</small>
    </a>

    <!-- 2. Location Selector -->
    <div class="d-none d-lg-flex align-items-center me-4 cursor-pointer text-start">
      <i class="bi bi-geo-alt-fill text-brand-orange fs-4 me-2"></i>
      <div class="d-flex flex-column">
        <span class="text-muted fs-8 fw-medium lh-1">Deliver to</span>
        <div class="dropdown">
          <button class="btn btn-sm p-0 fw-semibold text-dark dropdown-toggle fs-7 border-0 shadow-none" type="button" data-bs-toggle="dropdown">
            Tower C, Nirvana Country, Sec 50
          </button>
          <ul class="dropdown-menu shadow border-0 fs-7">
            <li><a class="dropdown-item" href="#">Tower C, Nirvana Country, Sec 50</a></li>
            <li><a class="dropdown-item" href="#">Home - Sector 62, Noida</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-brand-orange fw-bold" href="#">+ Add New Address</a></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 3. Center Search Bar with Integrated Orange Button -->
    <div class="flex-grow-1 my-2 my-lg-0 me-lg-4" style="max-width: 550px;">
      <div class="input-group">
        <input 
          type="text" 
          class="form-control bg-light border-end-0 py-2 ps-3 shadow-none fs-7" 
          placeholder="Search for &quot;milk, eggs, bread...&quot;"
          style="border-top-left-radius: 8px; border-bottom-left-radius: 8px;"
        />
        <button 
          class="btn btn-brand-orange px-3 d-flex align-items-center justify-content-center" 
          type="button"
          style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-top-right-radius: 8px; border-bottom-right-radius: 8px;">
          <i class="bi bi-search fs-6"></i>
        </button>
      </div>
    </div>

    <!-- 4. Right Controls (Auth, Wishlist, Cart) -->
    <div class="d-flex align-items-center gap-3 ms-auto">
      
      @if (authService.isLoggedInSignal()) {
        <!-- Logged In State -->
        <div class="dropdown">
          <button class="btn btn-light rounded-pill border dropdown-toggle d-flex align-items-center gap-2 fs-7 fw-medium shadow-none" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle fs-5 text-brand-orange"></i> 
            <span>{{ authService.currentUser()?.name || authService.currentUser()?.full_name || 'My Account' }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 fs-7 py-2 mt-1">
            <li>
              <a class="dropdown-item py-2 px-3 d-flex align-items-center gap-2" routerLink="/profile">
                <i class="bi bi-person text-muted fs-6"></i> Profile & Saved Addresses
              </a>
            </li>
            <li>
              <a class="dropdown-item py-2 px-3 d-flex align-items-center gap-2" routerLink="/my-orders">
                <i class="bi bi-box-seam text-muted fs-6"></i> My Orders
              </a>
            </li>
            <li><hr class="dropdown-divider my-1"></li>
            <li>
              <button class="dropdown-item py-2 px-3 d-flex align-items-center gap-2 text-danger" (click)="authService.logout()">
                <i class="bi bi-box-arrow-right fs-6"></i> Logout
              </button>
            </li>
          </ul>
        </div>
      } @else {
        <!-- Logged Out State (Triggers Signal-driven Instant Modal) -->
        <div 
          class="text-dark text-decoration-none fw-semibold fs-7 d-flex flex-column align-items-center cursor-pointer"
          (click)="authService.openAuthModal()"
        >
          <i class="bi bi-person fs-5"></i>
          <span>Login</span>
        </div>
      }

      <!-- Wishlist -->
      <a routerLink="/wishlist" class="text-dark text-decoration-none fw-semibold fs-7 d-flex flex-column align-items-center position-relative px-2">
        <i class="bi bi-heart fs-5"></i>
        <span>Wishlist</span>
      </a>

      <!-- My Cart Button with Dynamic Badge -->
      <button 
        (click)="cartService.openDrawer()" 
        class="btn btn-brand-orange text-white d-flex align-items-center gap-2 px-3 py-2 rounded-3 border-0 shadow-sm position-relative">

        <div class="position-relative">
          <i class="bi bi-cart3 fs-5"></i>
          
          <!-- Active Cart Items Badge Count -->
          @if (cartService.cartCount() > 0) {
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-dark text-white fs-8">
              {{ cartService.cartCount() }}
            </span>
          }
        </div>

        <div class="d-none d-sm-flex flex-column text-start lh-1">
          <span class="fw-bold fs-7">My Cart</span>
          @if (cartService.cartCount() > 0) {
            <small class="fs-8 text-white-50">₹{{ cartService.grandTotal() }}</small>
          }
        </div>
      </button>

    </div>
  </div>
</nav>
