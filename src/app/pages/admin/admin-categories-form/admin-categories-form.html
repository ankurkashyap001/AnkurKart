<div class="modal-backdrop fade show"></div>
<div class="modal d-block" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg p-2">
      
      <div class="modal-header border-bottom-0 pb-1">
        <h6 class="modal-title fw-bold text-dark fs-6">
          {{ categoryData ? 'Edit Category' : 'Add New Category' }}
        </h6>
        <button type="button" class="btn-close shadow-none" (click)="close()"></button>
      </div>

      <div class="modal-body fs-8 pt-2">
        <form (ngSubmit)="submitCategory()">

          <!-- IMAGE UPLOADER WITH PREVIEW -->
          <div class="mb-3">
            <label class="form-label fw-semibold text-muted mb-1">Category Icon / Image</label>
            
            @if (previewUrl()) {
              <div class="image-preview-wrapper position-relative rounded-4 p-3 d-flex align-items-center justify-content-center">
                <img [src]="previewUrl()" alt="Preview" class="preview-thumbnail img-fluid" />
                <button type="button" class="btn btn-danger btn-sm rounded-circle btn-remove-img" (click)="removeImage()" title="Remove Image">
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>
            } @else {
              <label class="upload-dropzone d-flex flex-column align-items-center justify-content-center rounded-4 p-4 text-center cursor-pointer">
                <i class="bi bi-cloud-arrow-up fs-2 text-brand-green mb-1"></i>
                <span class="fw-bold text-dark fs-8">Click or drag image to upload</span>
                <span class="text-muted fs-9 mt-1">PNG, JPG, WEBP or SVG up to 2MB</span>
                <input type="file" (change)="onFileSelected($event)" accept="image/*" class="d-none" />
              </label>
            }
          </div>

          <!-- NAME -->
          <div class="mb-3">
            <label class="form-label fw-semibold text-muted mb-1">Category Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control form-control-sm rounded-3 shadow-none py-2" placeholder="e.g. Dairy, Bread & Eggs"
                   [ngModel]="form.name" (ngModelChange)="onNameChange($event)" name="name" required />
          </div>

          <!-- SLUG -->
          <div class="mb-3">
            <label class="form-label fw-semibold text-muted mb-1">Slug</label>
            <input type="text" class="form-control form-control-sm rounded-3 shadow-none py-2 bg-light" placeholder="e.g. dairy-bread-eggs"
                   [(ngModel)]="form.slug" name="slug" />
          </div>

          <!-- ACTIVE SWITCH TOGGLE -->
          <div class="form-check form-switch mb-3 ps-5">
            <input class="form-check-input" type="checkbox" role="switch" id="catActiveSwitch" [(ngModel)]="form.is_active" name="is_active">
            <label class="form-check-label fw-semibold text-dark fs-8" for="catActiveSwitch">Active Status</label>
          </div>

          <!-- BUTTONS -->
          <div class="d-flex justify-content-end gap-2 mt-4 pt-2">
            <button type="button" class="btn btn-light btn-sm rounded-pill px-3 fs-8 fw-semibold" (click)="close()">Cancel</button>
            <button type="submit" class="btn btn-brand-green btn-sm rounded-pill px-4 fs-8 fw-bold" [disabled]="isSubmitting()">
              @if (isSubmitting()) {
                <span class="spinner-border spinner-border-sm me-1" role="status"></span> Saving...
              } @else {
                {{ categoryData ? 'Update Category' : 'Save Category' }}
              }
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
