<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0 rounded-3">
        <div class="card-body p-4">
          <h3 class="text-center fw-bold text-dark mb-4">Welcome Back</h3>
          
          <form>
            <div class="mb-3">
              <label class="form-label font-weight-bold">Email address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" placeholder="name@example.com" required>
              </div>
            </div>
  
            <div class="mb-3">
              <label class="form-label font-weight-bold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" placeholder="••••••••" required>
              </div>
            </div>
  
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label small" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="text-primary small text-decoration-none">Forgot password?</a>
            </div>
  
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
              Login
            </button>
          </form>
  
          <div class="text-center mt-4">
            <span class="small text-muted">Don't have an account? </span>
            <a routerLink="/register" class="small fw-bold text-decoration-none">Sign Up</a>
          </div>
        </div>
      </div>
    </div>
  </div>
